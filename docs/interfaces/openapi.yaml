openapi: 3.1.0
info:
  title: AIoT Remote-Sensing Ingest API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Preferred idempotent protocol for creating a capture session, uploading
    RGB/NIR assets, and obtaining a checksum-validated acknowledgement.
servers:
  - url: https://ingest.example.invalid
security:
  - mutualTLS: []
  - oauth2ClientCredentials: [capture:write]
paths:
  /v1/capture-sessions:
    post:
      operationId: createCaptureSession
      summary: Create or reconcile an idempotent capture session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaptureSessionRequest"
      responses:
        "200":
          description: Existing session reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaptureSessionResponse"
        "201":
          description: New session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCaptureSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key conflicts with different content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/capture-sessions/{session_id}:
    get:
      operationId: getCaptureSession
      summary: Reconcile remote session and uploaded asset state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSessionState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/capture-sessions/{session_id}/assets/{asset_id}:
    put:
      operationId: uploadCaptureAsset
      summary: Direct API fallback for one binary asset
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AssetId"
        - name: Digest
          in: header
          required: true
          description: RFC 9530-style sha-256 digest or backend-agreed equivalent
          schema:
            type: string
        - name: Content-Length
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/x-adobe-dng:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Existing identical asset accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReceipt"
        "201":
          description: Asset accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Asset identity or digest conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Asset exceeds accepted size
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/capture-sessions/{session_id}/complete:
    post:
      operationId: completeCaptureSession
      summary: Validate required assets and acknowledge a capture session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCaptureSessionRequest"
      responses:
        "200":
          description: Session accepted or existing acknowledgement returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureAcknowledgement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Required asset missing or checksum mismatch
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/device-health:
    post:
      operationId: postDeviceHealth
      summary: Submit a periodic device-health observation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceHealthEvent"
      responses:
        "202":
          description: Health event accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.invalid/oauth2/token
          scopes:
            capture:write: Create and upload capture sessions

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Request is malformed or fails schema validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Device credential is missing invalid expired or revoked
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested session or asset does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Client shall honor Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Retryable backend error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AssetManifest:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - role
        - filename
        - media_type
        - byte_size
        - sha256
      properties:
        asset_id:
          type: string
        role:
          type: string
          enum:
            - rgb_preview
            - nir_preview
            - rgb_raw
            - nir_raw
            - rgb_motion_reference
            - diagnostic
        filename:
          type: string
        media_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"

    CreateCaptureSessionRequest:
      type: object
      additionalProperties: false
      required:
        - capture_id
        - metadata
        - assets
      properties:
        capture_id:
          type: string
          format: uuid
        metadata:
          $ref: "./capture-metadata.schema.json"
        assets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssetManifest"

    UploadInstruction:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - state
      properties:
        asset_id:
          type: string
        state:
          type: string
          enum:
            - missing
            - uploaded
            - accepted
        upload_url:
          type:
            - string
            - "null"
          format: uri
        method:
          type:
            - string
            - "null"
          enum:
            - PUT
            - POST
            - null
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type:
            - string
            - "null"
          format: date-time

    CreateCaptureSessionResponse:
      type: object
      additionalProperties: false
      required:
        - capture_id
        - session_id
        - state
        - assets
      properties:
        capture_id:
          type: string
          format: uuid
        session_id:
          type: string
        state:
          type: string
          enum:
            - created
            - uploading
            - ready_to_complete
            - accepted
            - rejected
        assets:
          type: array
          items:
            $ref: "#/components/schemas/UploadInstruction"

    AssetReceipt:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - byte_size
        - sha256
        - state
      properties:
        asset_id:
          type: string
        byte_size:
          type: integer
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        state:
          type: string
          enum:
            - uploaded
            - accepted

    CompleteCaptureSessionRequest:
      type: object
      additionalProperties: false
      required:
        - capture_id
        - assets
      properties:
        capture_id:
          type: string
          format: uuid
        assets:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - asset_id
              - sha256
            properties:
              asset_id:
                type: string
              sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"

    CaptureAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - capture_id
        - session_id
        - state
        - accepted_at
        - assets
      properties:
        capture_id:
          type: string
          format: uuid
        session_id:
          type: string
        state:
          type: string
          const: accepted
        accepted_at:
          type: string
          format: date-time
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetReceipt"

    CaptureSessionState:
      allOf:
        - $ref: "#/components/schemas/CreateCaptureSessionResponse"
        - type: object
          properties:
            accepted_at:
              type:
                - string
                - "null"
              format: date-time

    DeviceHealthEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - device_id
        - observed_at
        - overall
        - metrics
        - error_codes
      properties:
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
        observed_at:
          type: string
          format: date-time
        overall:
          type: string
          enum:
            - ok
            - degraded
            - critical
        metrics:
          type: object
          additionalProperties:
            type:
              - number
              - string
              - boolean
              - "null"
        error_codes:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
            - request_id
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            capture_id:
              type:
                - string
                - "null"
            request_id:
              type: string
